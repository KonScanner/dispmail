title: DispMail
description: Create one disposable mailbox without giving the provider your personal data.
url: https://konscanner.github.io
baseurl: /dispmail
lang: en
tagline: a disposable mailbox without personal data

remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: pages
    values:
      image:
        path: /assets/img/social-card.png
        alt: "DispMail: create one disposable mailbox without giving the provider your personal data"

color_scheme: light
search_enabled: true
search:
  heading_level: 2
  previews: 2
  preview_words_before: 3
  preview_words_after: 4
  tokenizer_separator: /[\s/]+/
  button: false
heading_anchors: true
nav_sort: case_insensitive

aux_links:
  Source: https://github.com/KonScanner/dispmail
aux_links_new_tab: true

back_to_top: true
back_to_top_text: Back to top

footer_content: >-
  DispMail runs on your computer. Your accounts stay in a local file.

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - recon/
  - superpowers/
